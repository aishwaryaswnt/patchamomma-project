server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: patchamomma-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/patchamomma_db}
    username: ${SPRING_DATASOURCE_USERNAME:patcha_user}
    password: ${SPRING_DATASOURCE_PASSWORD:patcha_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    root: INFO
    com.patchamomma.api: DEBUG
